<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>age of palettes</title>
		<link rel="stylesheet" href="./src/styles.css" />
	</head>
	<body>
		<div id="app">
			<ul id="player-list">
				<li id="Player 1"><button class="btn">P1</button></li>
				<li id="Player 2"><button class="btn">P2</button></li>
				<li id="Player 3"><button class="btn">P3</button></li>
				<li id="Player 4"><button class="btn">P4</button></li>
				<li id="Player 5"><button class="btn">P5</button></li>
				<li id="Player 6"><button class="btn">P6</button></li>
				<li id="Player 7"><button class="btn">P7</button></li>
				<li id="Player 8"><button class="btn">P8</button></li>
				<li id="Gaia"><button class="btn">G</button></li>
			</ul>
			<div id="preview-all">
				<img
					name="Player 1"
					src="/preview.png"
					width="1780"
					height="780"
					alt="preview p1"
				/>
				<img
					name="Player 2"
					src="/preview.png"
					width="1780"
					height="780"
					alt="preview p2"
				/>
				<img
					name="Player 3"
					src="/preview.png"
					width="1780"
					height="780"
					alt="preview p3"
				/>
				<img
					name="Player 4"
					src="/preview.png"
					width="1780"
					height="780"
					alt="preview p4"
				/>
				<img
					name="Player 5"
					src="/preview.png"
					width="1780"
					height="780"
					alt="preview p5"
				/>
				<img
					name="Player 6"
					src="/preview.png"
					width="1780"
					height="780"
					alt="preview p6"
				/>
				<img
					name="Player 7"
					src="/preview.png"
					width="1780"
					height="780"
					alt="preview p7"
				/>
				<img
					name="Player 8"
					src="/preview.png"
					width="1780"
					height="780"
					alt="preview p8"
				/>
				<img
					name="Gaia"
					src="/preview.png"
					width="1780"
					height="780"
					alt="preview gaia"
				/>
			</div>
			<div id="editor">
				<h2></h2>
				<div class="inputs">
					<input class="btn" type="color" name="picker" id="picker" />
					<div class="row">
						<label for="hex">HEX</label>
						<input type="text" name="hex" id="hex" autocomplete="off" />
					</div>
					<div class="row">
						<span>RGB</span>
						<input
							type="number"
							name="rgb-r"
							id="rgb-r"
							min="0"
							max="255"
						/>
						<input
							type="number"
							name="rgb-g"
							id="rgb-g"
							min="0"
							max="255"
						/>
						<input
							type="number"
							name="rgb-b"
							id="rgb-b"
							min="0"
							max="255"
						/>
					</div>
					<div class="row">
						<span>HSV</span>
						<input
							type="number"
							name="hsv-h"
							id="hsv-h"
							min="0"
							max="360"
						/>
						<input
							type="number"
							name="hsv-s"
							id="hsv-s"
							min="0"
							max="100"
						/>
						<input
							type="number"
							name="hsv-v"
							id="hsv-v"
							min="0"
							max="100"
						/>
					</div>
					<div class="row">
						<span>HSL</span>
						<input
							type="number"
							name="hsl-h"
							id="hsl-h"
							min="0"
							max="360"
						/>
						<input
							type="number"
							name="hsl-s"
							id="hsl-s"
							min="0"
							max="100"
						/>
						<input
							type="number"
							name="hsl-l"
							id="hsl-l"
							min="0"
							max="100"
						/>
					</div>
				</div>
				<img
					id="preview"
					src="/preview.png"
					width="1780"
					height="780"
					alt="preview"
				/>
			</div>
			<div class="icon-buttons">
				<a
					id="download"
					class="btn"
					download="spritecolors.json"
					type="text/plain"
				>
					<svg role="presentation" aria-hidden="true">
						<use href="/icons.svg#download-icon"></use>
					</svg>
				</a>
			</div>
		</div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
