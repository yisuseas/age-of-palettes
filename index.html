<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>age-of-palettes</title>
		<link rel="stylesheet" href="./src/styles.css" />
	</head>
	<body>
		<div id="app">
			<ul id="player-list">
				<li id="Player 1"><button>P1</button></li>
				<li id="Player 2"><button>P2</button></li>
				<li id="Player 3"><button>P3</button></li>
				<li id="Player 4"><button>P4</button></li>
				<li id="Player 5"><button>P5</button></li>
				<li id="Player 6"><button>P6</button></li>
				<li id="Player 7"><button>P7</button></li>
				<li id="Player 8"><button>P8</button></li>
				<li id="Gaia"><button>Gaia</button></li>
			</ul>
			<div id="editor">
				<h2></h2>
				<div class="row">
					<input type="color" name="picker" id="picker" />
				</div>
				<div class="row">
					<label for="hex">hex</label>
					<input type="text" name="hex" id="hex" autocomplete="off" />
				</div>
				<div class="row">
					<span>rgb</span>
					<input type="number" name="rgb-r" id="rgb-r" min="0" max="255" />
					<input type="number" name="rgb-g" id="rgb-g" min="0" max="255" />
					<input type="number" name="rgb-b" id="rgb-b" min="0" max="255" />
				</div>
				<div class="row">
					<span>hsv</span>
					<input type="number" name="hsv-h" id="hsv-h" min="0" max="360" />
					<input type="number" name="hsv-s" id="hsv-s" min="0" max="100" />
					<input type="number" name="hsv-v" id="hsv-v" min="0" max="100" />
				</div>
				<div class="img-container">
					<img
						id="preview"
						src="/preview.png"
						width="1780"
						height="780"
						alt="preview"
					/>
				</div>
			</div>
		</div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
